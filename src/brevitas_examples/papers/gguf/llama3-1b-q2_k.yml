# non-defaults only; see default_template.yaml for defaults
model: meta-llama/Llama-3.2-1B-Instruct
dtype: float16  # llama.cpp uses FP16 internally

# Q2_K mixed-precision recipe for Llama 3.2 1B (base or Instruct)
custom_quantizer: recipes/Llama-3.2-1B.py:gguf_q2_k
# Required so the custom quantizer's high-precision (Q6_K) bump for
# token_embd/output is actually applied; otherwise those tensors are left
# unquantized (F32) at export time
quantize_first_last_layer: true

# Eval PPL on wikitext2 before/after quantization
eval: true
bos_preprocessing: sequence
dataset: wikitext2          # default, shown for clarity
dataset_eval_split: test    # match llama-perplexity's split for apples-to-apples comparison
nsamples: 128
seqlen: 2048

# run Qronos (Zhang et al., ICLR 2026)
qronos: true
qronos_alpha: 1e-6
gpxq_act_order: true
gpxq_block_name: model.layers
gpxq_use_quant_activations: true
gpxq_buffer_device: same

# GGUF export
export_target: gguf:q2_k
export_path: scratch/Llama-3.2-1B-Instruct-Q2_K.gguf
