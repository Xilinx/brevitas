name: Brevitas test assets
description: Prepare, restore or cache the models, datasets and weights used by the example tests
inputs:
  family:
    description: llm, diffusion or datasets
    required: true
  mode:
    description: >
      prepare downloads the assets once, with nox -s prepare_<family>_assets, and publishes them.
      restore gets the published assets, fails on a miss and makes the tests run offline.
    required: true
  python-version:
    description: Python version of the prepare mode
    required: false
runs:
  using: composite
  steps:
    # Only the files that decide what prepare downloads and where it is stored are hashed. The
    # datasets do not depend on noxfile.py, and their download is slow, so editing it must not
    # rebuild them.
    - name: Compute the cache key
      id: key
      shell: bash
      run: >
        echo "key=${{ runner.os }}-brevitas-test-assets-${{ inputs.family }}-${{
        startsWith(inputs.family, 'datasets')
        && hashFiles('tests/brevitas_examples/assets_for_tests.py',
        'src/brevitas_examples/bnn_pynq/cfg/*.ini')
        || hashFiles('tests/brevitas_examples/assets_for_tests.py', 'noxfile.py',
        'requirements/requirements-lighteval.txt', 'src/brevitas_examples/bnn_pynq/cfg/*.ini')
        }}" >> "$GITHUB_OUTPUT"

    - name: Look up or restore the cached assets
      id: restore
      if: inputs.mode != 'cache'
      uses: actions/cache/restore@v4
      with:
        path: data
        key: ${{ steps.key.outputs.key }}
        lookup-only: ${{ inputs.mode == 'prepare' }}
        fail-on-cache-miss: ${{ inputs.mode == 'restore' }}

    - name: Use prepared assets only
      if: inputs.mode == 'restore'
      shell: bash
      run: echo "BREVITAS_TEST_OFFLINE=1" >> "$GITHUB_ENV"

    - name: Set up Python
      if: inputs.mode == 'prepare' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/setup-python@v2
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Nox dependencies
      if: inputs.mode == 'prepare' && steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: pip install -r requirements/requirements-nox.txt

    - name: Prepare the assets
      if: inputs.mode == 'prepare' && steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: nox -v -s prepare_${{ inputs.family }}_assets

    - name: Save the assets
      if: inputs.mode == 'prepare' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: data
        key: ${{ steps.key.outputs.key }}

    # Saving only warns on failure: fail here, not in every job of the matrix.
    - name: Check the assets are published
      if: inputs.mode == 'prepare'
      uses: actions/cache/restore@v4
      with:
        path: data
        key: ${{ steps.key.outputs.key }}
        lookup-only: true
        fail-on-cache-miss: true
