name: Examples Pytest

on:
  push:
    branches: [ master, dev ]
  pull_request:
    types:
      - review_requested

jobs:
  prepare-assets:
    name: Cache brevitas datasets assets
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: ['windows-latest', 'ubuntu-latest', 'macos-latest']
    if: ${{ !github.event.pull_request.draft }}
    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Look up brevitas datasets assets
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: data
        key: ${{ runner.os }}-brevitas-test-assets-datasets-${{ hashFiles('tests/brevitas_examples/**/*.py', 'noxfile.py', 'requirements/requirements-lighteval.txt', 'src/brevitas_examples/bnn_pynq/cfg/*.ini') }}
        lookup-only: true

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'
      if: steps.cache.outputs.cache-hit != 'true'

    - name: Install Nox dependencies
      shell: bash
      run: pip install -r requirements/requirements-nox.txt
      if: steps.cache.outputs.cache-hit != 'true'

    - name: Prepare brevitas datasets assets
      shell: bash
      run: nox -v -s prepare_datasets_assets
      if: steps.cache.outputs.cache-hit != 'true'

    - name: Save brevitas datasets assets
      uses: actions/cache/save@v4
      with:
        path: data
        key: ${{ runner.os }}-brevitas-test-assets-datasets-${{ hashFiles('tests/brevitas_examples/**/*.py', 'noxfile.py', 'requirements/requirements-lighteval.txt', 'src/brevitas_examples/bnn_pynq/cfg/*.ini') }}
      if: steps.cache.outputs.cache-hit != 'true'

    - name: Check the assets are published
      uses: actions/cache/restore@v4
      with:
        path: data
        key: ${{ runner.os }}-brevitas-test-assets-datasets-${{ hashFiles('tests/brevitas_examples/**/*.py', 'noxfile.py', 'requirements/requirements-lighteval.txt', 'src/brevitas_examples/bnn_pynq/cfg/*.ini') }}
        lookup-only: true
        fail-on-cache-miss: true


  build:
    runs-on: ${{ matrix.platform }}
    needs: prepare-assets
    strategy:
      fail-fast: false


      matrix:
        python_version: ['3.10', '3.11']
        pytorch_version: ['2.2.2', '2.3.1', '2.4.1', '2.5.1', '2.6.0', '2.7.1']
        platform: ['windows-latest', 'ubuntu-latest', 'macos-latest']
        jit_status: ['jit_disabled', 'jit_enabled']




    if: ${{ !github.event.pull_request.draft }}
    steps:

    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
       python-version: ${{ matrix.python_version }}

    - name: Install Nox dependencies
      shell: bash
      run: pip install -r requirements/requirements-nox.txt

    - name: Install update
      shell: bash
      run: sudo apt-get update
      if: startsWith(runner.os, 'Linux') == true

    - name: Install libsndfile and libgomp1 on Ubuntu
      shell: bash
      run: sudo apt-get install -y libsndfile-dev libgomp1
      if: startsWith(runner.os, 'Linux') == true

    - name: Install libomp on macOS
      shell: bash
      run: brew install libomp
      if: startsWith(runner.os, 'macOS') == true

    - name: Restore brevitas datasets assets
      uses: actions/cache/restore@v4
      with:
        path: data
        key: ${{ runner.os }}-brevitas-test-assets-datasets-${{ hashFiles('tests/brevitas_examples/**/*.py', 'noxfile.py', 'requirements/requirements-lighteval.txt', 'src/brevitas_examples/bnn_pynq/cfg/*.ini') }}
        fail-on-cache-miss: true

    - name: Use prepared assets only
      shell: bash
      run: echo "BREVITAS_TEST_OFFLINE=1" >> "$GITHUB_ENV"

    - name: Run Nox session for brevitas_examples pytest
      shell: bash
      run: nox -v -s tests_brevitas_examples_cpu-${{ matrix.python_version }}\(${{ matrix.jit_status }}\,\ pytorch_${{ matrix.pytorch_version }}\)
