name: Pytest

on:
  push:
    branches: [ master, dev ]
  workflow_call:
    inputs:
      ref:
        description: 'Commit to test, passed by fulltest_comment.yml'
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false


      matrix:
        python_version: ['3.10', '3.11']
        pytorch_version: ['2.2.2', '2.3.1', '2.4.1', '2.5.1', '2.6.0', '2.7.1']
        platform: ['windows-latest', 'ubuntu-latest', 'macos-latest']
        jit_status: ['jit_disabled', 'jit_enabled']




    steps:

    - name: Checkout repo
      uses: actions/checkout@v3
      with:
        ref: ${{ inputs.ref }}
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
       python-version: ${{ matrix.python_version }}

    - name: Install Nox dependencies
      shell: bash
      run: pip install -r requirements/requirements-nox.txt

    - name: Install update
      shell: bash
      run: sudo apt-get update
      if: startsWith(runner.os, 'Linux') == true

    - name: Install libsndfile and libgomp1 on Ubuntu
      shell: bash
      run: sudo apt-get install -y libsndfile-dev libgomp1
      if: startsWith(runner.os, 'Linux') == true

    - name: Install libomp on macOS
      shell: bash
      run: brew install libomp
      if: startsWith(runner.os, 'macOS') == true

    - name: Run Nox session for brevitas pytest
      shell: bash
      run: nox -v -s tests_brevitas_cpu-${{ matrix.python_version }}\(${{ matrix.jit_status }}\,\ pytorch_${{ matrix.pytorch_version }}\)
