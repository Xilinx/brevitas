# NOTE: This workflow is NOT generated by gen_github_actions.py. Edit it by hand.
#
# It lets maintainers run the extended ("full") test suites by commenting on a pull request:
#
#   /fulltest                     -> run all extended suites
#   /fulltest pytest llm          -> run only the named suites
#
# Only users with write or admin permission on the repository can trigger the tests.
# Comments from other users fail the run silently (no reply is posted).
#
# The suites run as reusable workflows within this run, against the PR merge commit (the PR
# merged into its base branch) as it was when the comment was posted. Progress and results are
# reported on the PR as one commit status per suite (`fulltest/<suite>`) and in a reply comment.
# A new /fulltest run of a suite cancels the run of the same suite still in progress on the PR.
#
# Security: issue_comment workflows run with the base repository's privileges, and the tested
# code comes from the PR. Review the PR before commenting. The suites only get a read-only token
# and do not persist it on disk, but they share the base branch's actions cache.

name: Full Test (PR comment trigger)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      startsWith(github.event.comment.body, '/fulltest')
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    outputs:
      suites: ${{ steps.setup.outputs.suites }}
      head_sha: ${{ steps.setup.outputs.head_sha }}
      merge_sha: ${{ steps.setup.outputs.merge_sha }}
      comment_id: ${{ steps.setup.outputs.comment_id }}
    steps:
      - name: Authorize, resolve the commit to test and report pending status
        id: setup
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const comment = context.payload.comment;
            const prNumber = context.payload.issue.number;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            // Must match the suite job ids below.
            const allSuites = [
              'pytest', 'examples', 'llm', 'diffusion', 'vision',
              'develop_install', 'finn', 'ort', 'notebook', 'end_to_end',
            ];
            const reply = (body) =>
              github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });

            // 1. Parse the command: "/fulltest" followed by optional suite names, on the first line.
            const [command, ...requested] = comment.body.split('\n')[0].trim().split(/\s+/);
            if (command !== '/fulltest') {
              core.info(`"${command}" is not the /fulltest command, nothing to do.`);
              return;
            }

            // 2. Authorization: only maintainers (write/admin) may trigger. Fail without replying.
            const { data: { permission } } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner,
              repo,
              username: comment.user.login,
            });
            if (permission !== 'admin' && permission !== 'write') {
              core.setFailed(`User ${comment.user.login} is not a maintainer (permission: ${permission}).`);
              return;
            }

            const unknown = requested.filter((suite) => !allSuites.includes(suite));
            if (unknown.length > 0) {
              await reply(
                `Unknown suite(s): ${unknown.map((s) => `\`${s}\``).join(', ')}. ` +
                `Available suites: ${allSuites.map((s) => `\`${s}\``).join(', ')}.`);
              core.setFailed(`Unknown suites: ${unknown.join(', ')}`);
              return;
            }
            const suites = requested.length > 0 ? [...new Set(requested)] : allSuites;

            // 3. Resolve the merge commit. GitHub computes mergeability asynchronously, so poll
            //    until it is known.
            let pr;
            for (let attempt = 0; attempt < 12; attempt++) {
              ({ data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber }));
              if (pr.mergeable !== null) break;
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            if (pr.mergeable !== true) {
              await reply(
                `Cannot run the full test: the PR is not mergeable into \`${pr.base.ref}\` ` +
                `(conflicts, or mergeability could not be determined). [Workflow run](${runUrl})`);
              core.setFailed(`PR is not mergeable (mergeable: ${pr.mergeable}).`);
              return;
            }

            // 4. Only test code that existed when the comment was posted. The merge commit is
            //    created by GitHub, so its date cannot be forged by the PR author. It is also
            //    recreated when the base branch moves, in which case commenting again is enough.
            const { data: mergeCommit } = await github.rest.git.getCommit({
              owner,
              repo,
              commit_sha: pr.merge_commit_sha,
            });
            if (new Date(mergeCommit.committer.date) > new Date(comment.created_at)) {
              await reply(
                'Cannot run the full test: the PR or its base branch changed after the comment ' +
                `was posted. Review the latest changes and comment again. [Workflow run](${runUrl})`);
              core.setFailed('Merge commit is newer than the comment.');
              return;
            }

            // 5. Report pending status on the PR head commit and reply with the run link.
            const mergeSha = pr.merge_commit_sha;
            for (const suite of suites) {
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: pr.head.sha,
                state: 'pending',
                context: `fulltest/${suite}`,
                target_url: runUrl,
                description: `Running on merge commit ${mergeSha.slice(0, 7)}`,
              });
            }
            const { data: replyComment } = await reply(
              `Full test running on merge commit ${mergeSha} (\`${pr.base.ref}\` + ` +
              `${pr.head.sha}): ${suites.map((s) => `\`${s}\``).join(', ')}. ` +
              `[Workflow run](${runUrl})`);

            core.setOutput('suites', JSON.stringify(suites));
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('merge_sha', mergeSha);
            core.setOutput('comment_id', replyComment.id);

  pytest:
    needs: setup
    if: contains(fromJSON(needs.setup.outputs.suites || '[]'), 'pytest')
    concurrency:
      group: fulltest-${{ github.event.issue.number }}-pytest
      cancel-in-progress: true
    uses: ./.github/workflows/pytest.yml
    with:
      ref: ${{ needs.setup.outputs.merge_sha }}

  examples:
    needs: setup
    if: contains(fromJSON(needs.setup.outputs.suites || '[]'), 'examples')
    concurrency:
      group: fulltest-${{ github.event.issue.number }}-examples
      cancel-in-progress: true
    uses: ./.github/workflows/examples_pytest.yml
    with:
      ref: ${{ needs.setup.outputs.merge_sha }}

  llm:
    needs: setup
    if: contains(fromJSON(needs.setup.outputs.suites || '[]'), 'llm')
    concurrency:
      group: fulltest-${{ github.event.issue.number }}-llm
      cancel-in-progress: true
    uses: ./.github/workflows/examples_llm_pytest.yml
    with:
      ref: ${{ needs.setup.outputs.merge_sha }}

  diffusion:
    needs: setup
    if: contains(fromJSON(needs.setup.outputs.suites || '[]'), 'diffusion')
    concurrency:
      group: fulltest-${{ github.event.issue.number }}-diffusion
      cancel-in-progress: true
    uses: ./.github/workflows/examples_diffusion_pytest.yml
    with:
      ref: ${{ needs.setup.outputs.merge_sha }}

  vision:
    needs: setup
    if: contains(fromJSON(needs.setup.outputs.suites || '[]'), 'vision')
    concurrency:
      group: fulltest-${{ github.event.issue.number }}-vision
      cancel-in-progress: true
    uses: ./.github/workflows/examples_vision_pytest.yml
    with:
      ref: ${{ needs.setup.outputs.merge_sha }}

  develop_install:
    needs: setup
    if: contains(fromJSON(needs.setup.outputs.suites || '[]'), 'develop_install')
    concurrency:
      group: fulltest-${{ github.event.issue.number }}-develop_install
      cancel-in-progress: true
    uses: ./.github/workflows/develop_install.yml
    with:
      ref: ${{ needs.setup.outputs.merge_sha }}

  finn:
    needs: setup
    if: contains(fromJSON(needs.setup.outputs.suites || '[]'), 'finn')
    concurrency:
      group: fulltest-${{ github.event.issue.number }}-finn
      cancel-in-progress: true
    uses: ./.github/workflows/finn_integration.yml
    with:
      ref: ${{ needs.setup.outputs.merge_sha }}

  ort:
    needs: setup
    if: contains(fromJSON(needs.setup.outputs.suites || '[]'), 'ort')
    concurrency:
      group: fulltest-${{ github.event.issue.number }}-ort
      cancel-in-progress: true
    uses: ./.github/workflows/ort_integration.yml
    with:
      ref: ${{ needs.setup.outputs.merge_sha }}

  notebook:
    needs: setup
    if: contains(fromJSON(needs.setup.outputs.suites || '[]'), 'notebook')
    concurrency:
      group: fulltest-${{ github.event.issue.number }}-notebook
      cancel-in-progress: true
    uses: ./.github/workflows/notebook.yml
    with:
      ref: ${{ needs.setup.outputs.merge_sha }}

  end_to_end:
    needs: setup
    if: contains(fromJSON(needs.setup.outputs.suites || '[]'), 'end_to_end')
    concurrency:
      group: fulltest-${{ github.event.issue.number }}-end_to_end
      cancel-in-progress: true
    uses: ./.github/workflows/end_to_end.yml
    with:
      ref: ${{ needs.setup.outputs.merge_sha }}

  report:
    runs-on: ubuntu-latest
    needs:
      [setup, pytest, examples, llm, diffusion, vision, develop_install, finn, ort, notebook, end_to_end]
    if: ${{ always() && needs.setup.outputs.head_sha != '' }}
    permissions:
      pull-requests: write
      statuses: write
    steps:
      - name: Report results on the PR
        uses: actions/github-script@v7
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const needs = JSON.parse(process.env.NEEDS);
            const { suites, head_sha: headSha, merge_sha: mergeSha, comment_id: commentId } =
              needs.setup.outputs;

            const lines = [];
            for (const suite of JSON.parse(suites)) {
              const result = needs[suite].result;
              lines.push(`| \`${suite}\` | ${result === 'success' ? '✅' : '❌'} ${result} |`);
              // A cancelled suite was superseded by a newer /fulltest run, which owns its status.
              if (result === 'cancelled') continue;
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: headSha,
                state: result === 'success' ? 'success' : 'failure',
                context: `fulltest/${suite}`,
                target_url: runUrl,
                description: `${result} on merge commit ${mergeSha.slice(0, 7)}`,
              });
            }

            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: Number(commentId),
              body:
                `Full test finished on merge commit ${mergeSha}. [Workflow run](${runUrl})\n\n` +
                '| Suite | Result |\n| --- | --- |\n' + lines.join('\n'),
            });
