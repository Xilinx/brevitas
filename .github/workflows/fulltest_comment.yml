# NOTE: This workflow is NOT generated by gen_github_actions.py. Edit it by hand.
#
# It lets maintainers trigger the extended ("full") test suites by commenting
# on a pull request:
#
#   /fulltest                     -> dispatch all extended suites
#   /fulltest pytest llm          -> dispatch only the named suites
#
# Only users with write or admin permission on the repository are allowed to
# trigger the tests. Unauthorized comments fail the run silently (no reply is
# posted).
#
# The extended suites are dispatched via workflow_dispatch against the PR's
# target branch (master), checking out the PR head commit for testing.

name: Full Test (PR comment trigger)

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/fulltest')
    steps:
      - name: Dispatch extended test suites
        uses: actions/github-script@v7
        with:
          script: |
            const commenter = context.payload.comment.user.login;
            const { owner, repo } = context.repo;

            // 1. Authorization: only repo maintainers (write/admin) may trigger.
            //    On failure we exit silently (no comment / no reaction).
            let permission;
            try {
              const resp = await github.rest.repos.getCollaboratorPermissionLevel({
                owner,
                repo,
                username: commenter,
              });
              permission = resp.data.permission;
            } catch (error) {
              core.setFailed(`Could not resolve permission for ${commenter}: ${error.message}`);
              return;
            }
            if (permission !== 'admin' && permission !== 'write') {
              core.setFailed(`User ${commenter} is not a maintainer (permission: ${permission}).`);
              return;
            }

            // 2. Resolve the PR head sha (to test) and base branch (to dispatch on).
            const prNumber = context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });
            const headSha = pr.head.sha;
            const baseRef = pr.base.ref;

            // 3. Map suite keywords -> generated workflow filenames.
            const suiteMap = {
              pytest: 'pytest.yml',
              examples: 'examples_pytest.yml',
              llm: 'examples_llm_pytest.yml',
              diffusion: 'examples_diffusion_pytest.yml',
              vision: 'examples_vision_pytest.yml',
              develop_install: 'develop_install.yml',
              finn: 'finn_integration.yml',
              ort: 'ort_integration.yml',
              notebook: 'notebook.yml',
              end_to_end: 'end_to_end.yml',
            };

            // 4. Parse requested scope from the comment body.
            //    No args -> all suites. Unknown tokens are ignored silently.
            const body = context.payload.comment.body.trim();
            const tokens = body.split(/\s+/).slice(1); // drop the leading /fulltest
            let selected;
            if (tokens.length === 0) {
              selected = Object.values(suiteMap);
            } else {
              selected = tokens
                .filter((t) => Object.prototype.hasOwnProperty.call(suiteMap, t))
                .map((t) => suiteMap[t]);
            }
            selected = [...new Set(selected)]; // de-duplicate

            if (selected.length === 0) {
              core.setFailed('No known suites requested; nothing to dispatch.');
              return;
            }

            // 5. Dispatch each selected suite on the PR target branch, testing the PR head.
            for (const workflow_id of selected) {
              core.info(`Dispatching ${workflow_id} on ${baseRef} for ${headSha}`);
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id,
                ref: baseRef,
                inputs: { pr_ref: headSha },
              });
            }
