
default_language_version:
    python: python3

default_stages: [commit]

exclude: '(src/brevitas/backport|docs)'

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.0.1
  hooks:
  - id: trailing-whitespace
  - id: check-added-large-files
    args: [--maxkb=5000]
  - id: check-ast
  - id: check-json
  - id: check-merge-conflict
  - id: check-xml
  - id: check-yaml
    args: [--allow-multiple-documents]
  - id: debug-statements
  - id: end-of-file-fixer
  - id: requirements-txt-fixer
  - id: mixed-line-ending

-   repo: https://github.com/pycqa/isort
    rev: 5.11.5
    hooks:
    -   id: isort
        name: isort (python)


-   repo: https://github.com/pre-commit/mirrors-yapf
    rev: v0.32.0  # Use the sha / tag you want to point at
    hooks:
    - id: yapf
      args: ["-i"]
      additional_dependencies: [toml]

-   repo: local
    hooks:
    - id: gen-github-actions
      name: Regenerate GitHub Actions workflows
      # Regenerates the workflow YAMLs from gen_github_actions.py upon
      # changes to gen_github_actions.py or any of the workflow templates.
      # The generator opens its templates/outputs via bare relative paths, so it
      # must run from inside .github/workflows/ (pre-commit invokes hooks from
      # the repo root).
      entry: bash -c 'cd .github/workflows && python gen_github_actions.py'
      language: python
      additional_dependencies: [pyyaml]
      pass_filenames: false
      files: '^\.github/workflows/((gen_github_actions|utils)\.py|.*\.yml\.template)$'
